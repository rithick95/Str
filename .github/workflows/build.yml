name: Build from zip
on:
  push:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q cloud_stream.zip
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - working-directory: cloud_stream
        run: |
          flutter create . --platforms=android --org com.cloudstream
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: cloud_stream/build/app/outputs/flutter-apk/app-release.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: Expand-Archive cloud_stream.zip -DestinationPath .
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - working-directory: cloud_stream
        run: |
          flutter config --enable-windows-desktop
          flutter create . --platforms=windows --org com.cloudstream
          flutter pub get
          flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: windows-app
          path: cloud_stream/build/windows/x64/runner/Release
